<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latijn 3e graad — S.O. Groenhove Waregem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Flanders Art Sans';
    src: url('fonts/flanders-art-sans/FlandersArtSans-Bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --waregem-red-pulse: #FF3B1D;
    --balanced-yellow: #ffea3d;
    --deep-forest: #006633;
    --achtergrond: #fffbd8;
    --kaart: #ffffff;
    --tekst: #010100;
    --tekst-zacht: #7f8d88;
    --lijn-goud: rgba(196, 151, 41, .58);
    --schaduw: 0 18px 38px rgba(0, 42, 21, .10);
    --ft: 'Flanders Art Sans', Arial, sans-serif;
    --fb: 'Noto Sans', Arial, sans-serif;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; }

  body {
    font-family: var(--fb);
    background: var(--achtergrond);
    color: var(--tekst);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.2rem, 3vw, 2rem);
    position: relative;
    overflow-x: hidden;
  }

  .hero-curve {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: auto;
    pointer-events: none;
    z-index: 0;
    user-select: none;
  }

  .hero-logo {
    position: fixed;
    left: clamp(2rem, 6vw, 5.6rem);
    bottom: clamp(2rem, 7vw, 5rem);
    width: clamp(86px, 9vw, 150px);
    height: auto;
    z-index: 2;
    pointer-events: none;
    user-select: none;
    animation: logoIn .8s ease-out both;
  }

  .background-image {
    position: fixed;
    right: 0;
    bottom: 0;
    width: min(46vw, 720px);
    max-height: 92vh;
    object-fit: contain;
    object-position: right bottom;
    opacity: .72;
    pointer-events: none;
    z-index: 1;
    user-select: none;
    animation: bgIn .9s ease-out both;
  }

  .content {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 900px;
    margin-left: clamp(5rem, 15vw, 15rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: pageIn .55s ease-out both;
  }

  .gold-divider {
    width: min(320px, 40vw);
    height: 13px;
    margin: 0 0 1rem;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gold-divider::before,
  .gold-divider::after {
    content: '';
    height: 1px;
    flex: 1;
    background: linear-gradient(to right, transparent, var(--lijn-goud));
  }
  .gold-divider::after {
    background: linear-gradient(to left, transparent, var(--lijn-goud));
  }
  .gold-divider span {
    width: 9px;
    height: 9px;
    margin: 0 14px;
    border: 1px solid var(--lijn-goud);
    transform: rotate(45deg);
    background: var(--achtergrond);
  }

  .keuze-titel {
    font-family: var(--ft);
    font-size: clamp(2.55rem, 5vw, 4.8rem);
    font-weight: 700;
    color: var(--deep-forest);
    text-align: center;
    line-height: .96;
    margin-bottom: .7rem;
    letter-spacing: -.045em;
    text-shadow: 0 8px 24px rgba(0, 102, 51, .08);
  }

  .keuze-subtitel {
    font-family: var(--fb);
    font-size: clamp(.88rem, 1.2vw, 1rem);
    color: var(--tekst-zacht);
    text-align: center;
    margin-bottom: clamp(2rem, 3vw, 2.6rem);
  }

  .jaar-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(240px, 1fr));
    gap: clamp(1.2rem, 2.2vw, 1.75rem);
    width: min(100%, 720px);
    margin-bottom: clamp(1.7rem, 2.7vw, 2.4rem);
    align-items: stretch;
  }

  .jaar-kaart {
    --kaart-kleur: var(--deep-forest);
    position: relative;
    min-height: 292px;
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--kaart);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: var(--schaduw);
    transition: transform .22s ease, box-shadow .22s ease;
  }

  .jaar-kaart::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 34%;
    background: var(--kaart-kleur);
    z-index: 0;
  }

  .jaar-kaart::after {
    content: '';
    position: absolute;
    left: -8%;
    right: -8%;
    top: 24%;
    height: 76px;
    background: var(--kaart);
    border-radius: 50% 50% 0 0 / 72% 72% 0 0;
    z-index: 1;
    transform: rotate(-2deg);
  }

  .jaar-kaart.vijfde { --kaart-kleur: var(--waregem-red-pulse); }
  .jaar-kaart.zesde { --kaart-kleur: var(--balanced-yellow); }

  .jaar-kaart:hover {
    transform: translateY(-8px);
    box-shadow: 0 28px 60px rgba(0, 42, 21, .17);
  }
.jaar-inhoud {
    position: relative;
    z-index: 2;
    flex: 1;
    width: 100%;
    padding: 5.15rem 1.7rem 1.6rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .jaar-naam {
    font-family: var(--ft);
    font-size: clamp(1.55rem, 2.2vw, 2rem);
    font-weight: 700;
    line-height: 1;
    color: var(--kaart-kleur);
    margin-bottom: 1rem;
    letter-spacing: -.025em;
  }

  .jaar-kaart.zesde .jaar-naam { color: var(--deep-forest); }

  .jaar-omschrijving {
    font-family: var(--fb);
    font-size: .9rem;
    color: #6f7d78;
    line-height: 1.55;
    max-width: 15.5rem;
    flex: 1;
  }

  .jaar-pijl {
    width: 48px;
    height: 48px;
    margin-top: 1.35rem;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--waregem-red-pulse);
    color: #fff;
    font-family: var(--fb);
    font-size: 1.55rem;
    line-height: 1;
    box-shadow: 0 10px 24px rgba(255, 59, 29, .24);
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .jaar-kaart:hover .jaar-pijl {
    transform: translateX(4px);
    box-shadow: 0 14px 30px rgba(255, 59, 29, .32);
  }

  .footer-divider {
    width: min(360px, 52vw);
    height: 13px;
    margin: .1rem 0 .7rem;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .footer-divider::before,
  .footer-divider::after {
    content: '';
    height: 1px;
    flex: 1;
    background: linear-gradient(to right, transparent, var(--lijn-goud));
  }
  .footer-divider::after {
    background: linear-gradient(to left, transparent, var(--lijn-goud));
  }
  .footer-divider span {
    width: 9px;
    height: 9px;
    margin: 0 14px;
    border: 1px solid var(--lijn-goud);
    transform: rotate(45deg);
    background: var(--achtergrond);
  }

  .voet {
    font-family: var(--fb);
    font-size: .76rem;
    color: var(--tekst-zacht);
    text-align: center;
    letter-spacing: .02em;
  }

  @keyframes pageIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes logoIn {
    from { opacity: 0; transform: translateY(12px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes bgIn {
    from { opacity: 0; transform: translateX(18px); }
    to { opacity: .72; transform: translateX(0); }
  }

  @media (max-width: 900px) {
    body { justify-content: flex-start; padding-top: 4rem; }
    .content { margin-left: clamp(1rem, 12vw, 7rem); }
    .jaar-grid { grid-template-columns: 1fr; max-width: 360px; }
    .jaar-kaart { min-height: 280px; }
    .hero-logo { width: 76px; left: 1.1rem; bottom: 1.1rem; }
    .background-image {
      width: 62vw;
      opacity: .42;
      right: -10vw;
    }
  }

  @media (max-width: 560px) {
    body { padding: 3rem 1rem 2rem; }
    .hero-curve { opacity: .82; }
    .content { margin-left: 0; }
    .jaar-grid { max-width: 330px; }
    .keuze-titel { font-size: 2.45rem; }
    .gold-divider,
    .footer-divider { width: 210px; }
    .background-image {
      width: 86vw;
      opacity: .24;
      right: -22vw;
    }
  }
</style>
</head>
<body>

  <img class="hero-curve" src="images/heroes/curvedhero.svg" alt="" aria-hidden="true">
  <img class="background-image" src="images/heroes/aeneas-bg.png" alt="" aria-hidden="true">
  <img class="hero-logo" src="images/nav/logo_rood.svg" alt="" aria-hidden="true">

  <main class="content" aria-labelledby="pagina-titel">
    <div class="gold-divider" aria-hidden="true"><span></span></div>

    <h1 id="pagina-titel" class="keuze-titel">Latijn 3e graad</h1>
    <p class="keuze-subtitel">Kies het jaar om verder te gaan.</p>

    <div class="jaar-grid">
      <a class="jaar-kaart vijfde" href="5dejaar/index.html">
        <div class="jaar-inhoud">
          <div class="jaar-naam">5de jaar</div>
          <div class="jaar-omschrijving">Grammatica, teksten, vocabularium en oefeningen.</div>
          <div class="jaar-pijl" aria-hidden="true">→</div>
        </div>
      </a>

      <a class="jaar-kaart zesde" href="6dejaar/index.html">
        <div class="jaar-inhoud">
          <div class="jaar-naam">6de jaar</div>
          <div class="jaar-omschrijving">Grammatica, teksten, vocabularium en oefeningen.</div>
          <div class="jaar-pijl" aria-hidden="true">→</div>
        </div>
      </a>
    </div>

    <div class="footer-divider" aria-hidden="true"><span></span></div>
    <p class="voet">J. Everaerdt &mdash; S.O. Groenhove Waregem campus Atheneum</p>
  </main>

</body>
</html>
